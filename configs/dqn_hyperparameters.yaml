# Hyperparamètres de DQN (Stable-Baselines3), lus par rl/train_dqn.py (T28).
# La graine n'est pas ici : un agent par graine d'entraînement (experiment_config.yaml).
# Le budget (total_timesteps) dépend du scénario (experiment_config.yaml).
algorithm: DQN
learning_rate: 0.0003
gamma: 0.99
batch_size: 64
buffer_size: 200000
learning_starts: 1000
target_update_interval: 1000
exploration_fraction: 0.3
exploration_initial_eps: 1.0
exploration_final_eps: 0.02
net_arch: [128, 128]
